name: One-off Arena redesign

on:
  push:
    branches:
      - tk2-2026
    paths:
      - .github/workflows/oneoff-arena-redesign.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tk2-2026
          fetch-depth: 1
      - name: Apply arena redesign
        run: |
          python3 .github/scripts/arena_redesign_patch.py
          node --check 2026/qa/browser-smoke.mjs
      - name: Commit patch and cleanup helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 2026/index.html 2026/modern-battle.css 2026/qa/browser-smoke.mjs
          git commit -m "feat: redesign battle arena selection"
          git rm .github/workflows/oneoff-arena-redesign.yml .github/scripts/arena_redesign_patch.py
          git commit -m "chore: remove arena redesign helper"
          git push origin HEAD:tk2-2026
