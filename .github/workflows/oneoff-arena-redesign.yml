  border-radius: .72rem;
  background: rgba(9,20,37,.62);
}

#battleView .battle-meta-strip > span {
  min-width: 0;
  padding: .42rem .35rem;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .28rem;
  color: #8195ad;
  font-size: .58rem;
  text-align: center;
}

#battleView .battle-meta-strip > span + span {
  border-left: 1px solid rgba(148,163,184,.09);
}

#battleView .battle-meta-strip svg {
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  color: #8fa6c1;
}

#battleView .battle-meta-strip strong {
  color: #9fb7d1;
  font-weight: 800;
}

#battleView .battle-start-btn {
  width: min(390px,100%);
  min-height: 52px;
  margin: .08rem auto 0;
  padding: .68rem 1.2rem;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .5rem;
  border: 1px solid rgba(251,191,36,.86);
  border-radius: 999px;
  background:
    radial-gradient(170px 60px at 50% 0%, rgba(251,191,36,.12), transparent 72%),
    linear-gradient(180deg, rgba(36,38,37,.92), rgba(18,26,36,.96));
  color: #f8ce63;
  font-size: .82rem;
  font-weight: 920;
  box-shadow: 0 0 24px rgba(245,158,11,.11), inset 0 1px 0 rgba(255,255,255,.04);
  cursor: pointer;
  transition: transform .16s ease, box-shadow .16s ease, filter .16s ease;
}

#battleView .battle-start-btn svg {
  width: 21px;
  height: 21px;
}

#battleView .battle-start-btn:hover:not(:disabled) {
  transform: translateY(-1px);
  filter: brightness(1.08);
  box-shadow: 0 0 30px rgba(245,158,11,.18), inset 0 1px 0 rgba(255,255,255,.05);
}

#battleView .battle-start-btn:disabled {
  opacity: .42;
  cursor: not-allowed;
}

#battleView .battle-start-btn:focus-visible {
  outline: 2px solid rgba(251,191,36,.92);
  outline-offset: 3px;
}

@media (max-width: 1120px) {
  #battleView .battle-overview {
    grid-template-columns: minmax(205px,.82fr) minmax(380px,1.34fr) minmax(205px,.82fr);
  }
}

@media (max-width: 980px) {
  #battleView .battle-overview {
