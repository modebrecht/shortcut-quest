name: One-off Stage-aware Smoke

on:
  push:
    branches: [tk2-2026]
    paths:
      - '.github/workflows/oneoff-stage-nav-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tk2-2026
      - name: Patch browser smoke for stage navigation
        run: python3 2026/qa/patch_stage_nav_smoke.py
      - name: Verify smoke syntax
        run: |
          node --check 2026/qa/browser-smoke.mjs
          grep -q 'section-stage-button\[data-stage' 2026/qa/browser-smoke.mjs
      - name: Commit QA update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 2026/qa/browser-smoke.mjs
          git commit -m "test: make A8 browser smoke stage-aware"
          git push origin HEAD:tk2-2026
