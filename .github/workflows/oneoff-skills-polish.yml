name: One-off Skills Compact Polish

on:
  push:
    branches: [tk2-2026]
    paths:
      - '.github/workflows/oneoff-skills-polish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tk2-2026
      - name: Apply skills polish
        run: python3 2026/qa/patch_skills_polish.py
      - name: Verify syntax
        run: node --check 2026/qa/browser-smoke.mjs
      - name: Commit runtime and smoke changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 2026/modern-game.css 2026/qa/browser-smoke.mjs
          git commit -m "A8: compact and clarify skills view"
          git push origin HEAD:tk2-2026
