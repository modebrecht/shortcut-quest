name: One-off Stabilize A8 Interactions

on:
  push:
    branches: [tk2-2026]
    paths:
      - '.github/workflows/oneoff-stabilize-a8-interactions.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tk2-2026

      - name: Patch interaction observer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('2026/skill-hotkeys.js')
          text = path.read_text(encoding='utf-8')
          old = "\n".join([
              '    const host = document.getElementById("learnSections");',
              '    if (host) {',
              '      new MutationObserver(() => queueMicrotask(() => {',
              '        upgradeAllInteractiveUI();',
              '        refreshHintButtons();',
              '      })).observe(host, { childList: true, subtree: true });',
              '    }',
          ]) + "\n"
          new = "\n".join([
              '    const host = document.getElementById("learnSections");',
              '    if (host) {',
              '      let upgradeQueued = false;',
              '      const nodeNeedsUpgrade = node => {',
              '        if (!(node instanceof Element)) return false;',
              '        if (node.matches(".combo-row:not([data-a8-combo-filtered=\'true\']), .dnd-pool:not([data-a8-dnd-upgraded=\'true\'])")) return true;',
              '        if (node.matches("select:not([data-a8-buttonized=\'true\'])") && !node.closest(".combo-row[data-a8-combo-filtered=\'true\']")) return true;',
              '        if (node.querySelector(".combo-row:not([data-a8-combo-filtered=\'true\']), .dnd-pool:not([data-a8-dnd-upgraded=\'true\'])")) return true;',
              '        return Array.from(node.querySelectorAll("select:not([data-a8-buttonized=\'true\'])"))',
              '          .some(select => !select.closest(".combo-row[data-a8-combo-filtered=\'true\']"));',
              '      };',
              '      new MutationObserver(records => {',
              '        if (upgradeQueued) return;',
              '        const needsUpgrade = records.some(record => Array.from(record.addedNodes).some(nodeNeedsUpgrade));',
              '        if (!needsUpgrade) return;',
              '        upgradeQueued = true;',
              '        queueMicrotask(() => {',
              '          upgradeQueued = false;',
              '          upgradeAllInteractiveUI();',
              '          refreshHintButtons();',
              '        });',
              '      }).observe(host, { childList: true, subtree: true });',
              '    }',
          ]) + "\n"
          if old not in text:
              raise SystemExit('interaction observer anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          node --check 2026/skill-hotkeys.js
          grep -q 'nodeNeedsUpgrade' 2026/skill-hotkeys.js
          ! grep -Fq 'new MutationObserver(() => queueMicrotask(() =>' 2026/skill-hotkeys.js

      - name: Commit runtime stabilization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 2026/skill-hotkeys.js
          git diff --cached --check
          git commit -m "A8: stabilize interaction enhancement observer"
          git push origin HEAD:tk2-2026
