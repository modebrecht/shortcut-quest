name: One-off arena screenshot pass

on:
  push:
    branches: [tk2-2026]
    paths:
      - '.github/workflows/oneoff-arena-screenshot-pass.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tk2-2026
          fetch-depth: 1
      - name: Apply screenshot-faithful arena pass
        run: python3 2026/qa/_oneoff_arena_screenshot_pass.py
      - name: Commit runtime, QA, and cleanup helper
        run: |
          rm -f 2026/qa/_oneoff_arena_screenshot_pass.py .github/workflows/oneoff-arena-screenshot-pass.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 2026/modern-battle.css 2026/qa/browser-smoke.mjs 2026/qa/_oneoff_arena_screenshot_pass.py .github/workflows/oneoff-arena-screenshot-pass.yml
          git commit -m 'feat: match arena approved screenshot layout'
          git push origin HEAD:tk2-2026
