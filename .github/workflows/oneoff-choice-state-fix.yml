name: One-off Choice State Fix

on:
  push:
    branches: [tk2-2026]
    paths:
      - '.github/workflows/oneoff-choice-state-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tk2-2026
      - name: Apply choice state patch
        run: python3 2026/qa/patch_choice_states.py
      - name: Verify choice state patch
        run: |
          grep -q 'UNAMBIGUOUS CHOICE STATES' 2026/modern-exercises.css
          grep -q 'focus-visible:not(.selected)' 2026/modern-exercises.css
          grep -q 'Selected is the only pre-grade filled state' 2026/modern-exercises.css
      - name: Commit runtime changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 2026/modern-exercises.css
          git commit -m "A8: make choice states visually unambiguous"
          git push origin HEAD:tk2-2026
