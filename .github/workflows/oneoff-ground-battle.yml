name: One-off battle grounding fix

on:
  push:
    branches: [tk2-2026]
    paths:
      - '2026/qa/_oneoff_ground_battle.py'
      - '.github/workflows/oneoff-ground-battle.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tk2-2026
          fetch-depth: 1
      - name: Apply grounding fix
        run: python3 2026/qa/_oneoff_ground_battle.py
      - name: Commit runtime, test, and cleanup helper
        run: |
          rm -f 2026/qa/_oneoff_ground_battle.py .github/workflows/oneoff-ground-battle.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 2026/modern-battle.css 2026/qa/browser-smoke.mjs 2026/qa/_oneoff_ground_battle.py .github/workflows/oneoff-ground-battle.yml
          git commit -m 'fix: ground battle fighters inside arena'
          git push origin HEAD:tk2-2026
