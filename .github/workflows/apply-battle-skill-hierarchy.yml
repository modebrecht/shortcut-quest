name: Apply A8 Battle Skill Hierarchy

on:
  push:
    branches: [tk2-2026]
    paths:
      - '.github/workflows/apply-battle-skill-hierarchy.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tk2-2026
          fetch-depth: 1

      - name: Apply hierarchy and icon pass
        run: python3 .github/battle-skill-hierarchy-pass.py

      - name: Verify patch contract
        run: |
          grep -Fq 'BATTLE SKILL CONTENT HIERARCHY FIX 2026' 2026/modern-battle.css
          grep -Fq "heal: '<svg" 2026/index.html
          grep -Fq "lightning: '<svg" 2026/index.html
          grep -Fq "target: '<svg" 2026/index.html

      - name: Commit hierarchy pass
        run: |
          git config user.name 'modebrecht'
          git config user.email '137332207+modebrecht@users.noreply.github.com'
          git add 2026/modern-battle.css 2026/index.html
          git commit -m 'style: polish A8 battle skill hierarchy'
          git push origin HEAD:tk2-2026
