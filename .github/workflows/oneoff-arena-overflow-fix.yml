name: One-off Arena overflow fix

on:
  push:
    branches: [tk2-2026]
    paths:
      - .github/workflows/oneoff-arena-overflow-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tk2-2026
          fetch-depth: 1
      - name: Append shrink-safe compact rank styles
        run: |
          cat >> 2026/modern-battle.css <<'CSS'

          /* ARENA COMPACT RANK OVERFLOW FIX */
          #battleView .battle-buttons,
          #battleView .battle-buttons > *,
          #battleView .battle-btn-top,
          #battleView .battle-btn-copy {
            min-width: 0 !important;
            max-width: 100%;
          }

          #battleView .battle-btn {
            overflow: hidden;
          }

          #battleView .battle-btn.battle-compact .battle-btn-copy {
            width: 100%;
            display: block;
            text-align: center;
          }

          #battleView .battle-btn.battle-compact .battle-btn-name {
            display: none;
          }

          #battleView .battle-btn.battle-compact .battle-btn-rank {
            display: block;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-align: center;
          }
          CSS
      - name: Commit runtime and cleanup helper
        run: |
          rm -f .github/workflows/oneoff-arena-overflow-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: prevent compact arena rank overflow"
          git push origin HEAD:tk2-2026
