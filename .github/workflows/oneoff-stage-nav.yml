name: One-off Stage Navigation

on:
  push:
    branches: [tk2-2026]
    paths:
      - '.github/workflows/oneoff-stage-nav.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tk2-2026
      - name: Apply stage navigation patch
        run: python3 2026/qa/patch_stage_nav.py
      - name: Verify stage navigation
        run: |
          node --check 2026/skill-hotkeys.js
          grep -q 'install2026SectionStageNav' 2026/skill-hotkeys.js
          grep -q '30 Abschnitte' 2026/skill-hotkeys.js
          grep -q 'SECTION STAGE NAVIGATION' 2026/modern-ui.css
      - name: Commit runtime changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 2026/skill-hotkeys.js 2026/modern-ui.css
          git commit -m "A8: show 30 sections as three navigation stages"
          git push origin HEAD:tk2-2026
