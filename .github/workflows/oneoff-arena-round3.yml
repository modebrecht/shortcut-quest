name: One-off arena round 3

on:
  push:
    branches:
      - tk2-2026
    paths:
      - '.github/workflows/oneoff-arena-round3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tk2-2026
          fetch-depth: 0
      - name: Apply patch
        run: bash .github/scripts/arena-round3.sh
      - name: Commit result and remove helpers
        run: |
          git rm .github/workflows/oneoff-arena-round3.yml .github/scripts/arena-round3.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 2026/modern-battle.css
          git commit -m 'style: calm one-arena HUD and encounter hierarchy'
          git push origin HEAD:tk2-2026
