name: One-off Combo Builder Filter Pass

on:
  push:
    branches: [tk2-2026]
    paths:
      - .github/workflows/oneoff-combo-filter.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tk2-2026
          fetch-depth: 1

      - name: Patch Combo Builder UX and QA
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('2026/skill-hotkeys.js')
          text = p.read_text(encoding='utf-8')
          start = text.index('  function comboOptionValues(selects) {')
          end = text.index('\n  function upgradeDndPool(pool) {', start)
          replacement = r'''  const COMBO_MODIFIER_OPTIONS = ["Ctrl", "Shift", "Alt", "AltGr", "Win"];

  function uniqueComboValues(values) {
    const seen = new Set();
    return values.filter(value => {
      const clean = String(value || "").trim();
      if (!clean || seen.has(clean)) return false;
      seen.add(clean);
      return true;
    });
  }

  function compactComboCandidates(answer, preferred, fallback, limit = 6) {
    const result = [];
    const add = value => {
      const clean = String(value || "").trim();
      if (!clean || result.includes(clean)) return;
      result.push(clean);
    };
    add(answer);
    preferred.forEach(add);
    fallback.forEach(add);
    return result.slice(0, Math.max(2, limit));
  }

  function writeComboSelectOptions(select, values) {
    if (!select) return;
    const current = select.value || "";
    const answer = select.dataset.answer || "";
    const labels = new Map(Array.from(select.options).map(option => [option.value, option.textContent || option.value]));
    const finalValues = uniqueComboValues([...values, answer]);
    select.innerHTML = "";
    const placeholder = document.createElement("option");
    placeholder.value = "";
    placeholder.textContent = "auswählen";
    select.appendChild(placeholder);
    finalValues.forEach(value => {
      const option = document.createElement("option");
      option.value = value;
      option.textContent = labels.get(value) || value;
      select.appendChild(option);
    });
    select.value = finalValues.includes(current) ? current : "";
    select.__a8FilteredValues = finalValues.slice();
  }

  function upgradeComboRow(row) {
    if (!row || row.dataset.a8ComboFiltered === "true") return;
    const selects = Array.from(row.querySelectorAll(".combo-slot select"));
    if (!selects.length) return;
    row.dataset.a8ComboFiltered = "true";
    row.classList.add("a8-filtered-combo");
    row.querySelectorAll(".a8-combo-slot-button,.a8-combo-controls").forEach(node => node.remove());

    const section = row.closest(".section");
    const sectionSelects = Array.from(section?.querySelectorAll(".combo-row .combo-slot select") || selects);
    const sectionAnswers = sectionSelects.map(select => select.dataset.answer || "").filter(Boolean);
    const terminalPool = uniqueComboValues(sectionAnswers.filter(value => !COMBO_MODIFIER_OPTIONS.includes(value) && !value.includes("+")));
    const wholeShortcutPool = uniqueComboValues(sectionAnswers.filter(value => value.includes("+")));
    const atomicRow = selects.every(select => !(select.dataset.answer || "").includes("+"));
    const originalBySelect = new Map(selects.map(select => [select, Array.from(select.options).map(option => option.value).filter(Boolean)]));

    function baseCandidates(select, index) {
      const answer = select.dataset.answer || "";
      const original = originalBySelect.get(select) || [];
      if (!atomicRow) {
        return compactComboCandidates(answer, wholeShortcutPool, original, 5);
      }
      if (index === 0) {
        return compactComboCandidates(answer, COMBO_MODIFIER_OPTIONS, original, 5);
      }
      if (index < selects.length - 1) {
        return compactComboCandidates(answer, COMBO_MODIFIER_OPTIONS, original, 5);
      }
      return compactComboCandidates(answer, terminalPool, original.filter(value => !COMBO_MODIFIER_OPTIONS.includes(value)), 6);
    }

    selects.forEach((select, index) => {
      select.classList.remove("a8-native-select");
      select.dataset.a8ComboSelect = "true";
      const values = baseCandidates(select, index);
      writeComboSelectOptions(select, values);
      select.__a8BaseComboValues = values.slice();
    });

    const hintRow = document.createElement("div");
    hintRow.className = "a8-hint-row a8-combo-select-hint";
    const hint = document.createElement("button");
    hint.type = "button";
    hint.className = "a8-hint-button";
    hint.dataset.used = "false";
    const note = document.createElement("span");
    note.className = "a8-hint-note";
    hintRow.appendChild(hint);
    hintRow.appendChild(note);
    row.appendChild(hintRow);

    function hintTarget() {
      return selects.find(select => !select.value)
        || selects.find(select => select.classList.contains("incorrect"))
        || selects[selects.length - 1];
    }

    function syncCombo() {
      const xp = getSharedXP();
      const used = hint.dataset.used === "true";
      hint.disabled = used || xp < HINT_COST_XP_2026;
      hint.textContent = used
        ? `💡 Tipp genutzt (-${HINT_COST_XP_2026} XP)`
        : xp < HINT_COST_XP_2026
          ? `💡 Tipp (-${HINT_COST_XP_2026} XP | Zu wenig XP)`
          : `💡 Tipp (-${HINT_COST_XP_2026} XP)`;
    }

    hint.addEventListener("click", event => {
      event.preventDefault();
      if (hint.disabled || hint.dataset.used === "true") return;
      const select = hintTarget();
      if (!select) return;
      const answer = select.dataset.answer || "";
      const wrongOptions = Array.from(select.options).filter(option => option.value && option.value !== answer && option.value !== select.value);
      if (!wrongOptions.length || !spendHintXP()) return;
      wrongOptions[Math.floor(Math.random() * wrongOptions.length)].remove();
      hint.dataset.used = "true";
      note.textContent = "Eine falsche Auswahl wurde entfernt.";
      syncCombo();
    });

    row.__a8SyncCombo = syncCombo;
    row.__a8ResetCombo = () => {
      selects.forEach(select => {
        writeComboSelectOptions(select, select.__a8BaseComboValues || []);
        select.classList.remove("correct", "incorrect");
      });
      hint.dataset.used = "false";
      note.textContent = "";
      syncCombo();
    };
    syncCombo();
  }
'''
          text = text[:start] + replacement + text[end:]

          css_anchor = '      .a8-dnd-shell { display:flex;flex-direction:column;gap:.85rem;margin-top:.5rem; }'
          combo_css = '''      .a8-filtered-combo { align-items:flex-end; gap:.55rem!important; }\n      .a8-filtered-combo .combo-slot select { display:block!important;position:static!important;width:auto!important;height:44px!important;min-width:128px;max-width:180px;opacity:1!important;pointer-events:auto!important;clip:auto!important;overflow:visible!important;border:1px solid rgba(148,163,184,.38);border-radius:.8rem;background:#111c31;color:var(--text);padding:.45rem .65rem;font:inherit;font-weight:750; }\n      .a8-filtered-combo .combo-slot select:focus { outline:2px solid rgba(245,158,11,.55);outline-offset:2px;border-color:var(--accent); }\n      .a8-filtered-combo .a8-combo-select-hint { flex-basis:100%;margin-top:.2rem; }\n'''
          if combo_css.strip() not in text:
            text = text.replace(css_anchor, combo_css + css_anchor)
          p.write_text(text, encoding='utf-8')

          q = Path('2026/qa/browser-smoke.mjs')
          test = q.read_text(encoding='utf-8')
          test = test.replace(
'''  assert.equal(await page.locator('#learnSections select:visible').count(), 0, 'No native select may be visible');
  assert.ok(await page.locator('.section[data-section="3"] .a8-choice-option').count() > 0, 'Recognition questions should render answer buttons');
  assert.ok(await page.locator('.section[data-section="10"] .a8-combo-slot-button').count() > 0, 'Combo Builder should render clickable slots');
  assert.ok(await page.locator('.section[data-section="10"] .a8-combo-bank-option').count() > 0, 'Combo Builder should render a shared button bank');''',
'''  assert.equal(await page.locator('#learnSections select:visible').count(), 0, 'No dropdown should be visible before a Combo Builder is opened');
  assert.ok(await page.locator('.section[data-section="3"] .a8-choice-option').count() > 0, 'Recognition questions should render answer buttons');''')

          old_combo = '''  await page.locator('.section-tab[data-goto="10"]').click();
  const comboRow = page.locator('.section[data-section="10"] .combo-row').first();
  const firstComboSelect = comboRow.locator('select[data-answer]').first();
  const comboAnswer = await firstComboSelect.getAttribute('data-answer');
  assert.ok(comboAnswer);
  await comboRow.locator('.a8-combo-slot-button').first().click();
  const bankButtons = comboRow.locator('.a8-combo-bank-option');
  let comboAnswerButton = null;
  for (let i = 0; i < await bankButtons.count(); i += 1) {
    const button = bankButtons.nth(i);
    if ((await button.getAttribute('data-value')) === comboAnswer) {
      comboAnswerButton = button;
      break;
    }
  }
  assert.ok(comboAnswerButton, 'Correct Combo Builder answer must exist in shared button bank');
  await comboAnswerButton.click();
  assert.equal(await firstComboSelect.inputValue(), comboAnswer, 'Combo button bank must update the grader value');
  assert.equal(await page.locator('#learnSections select:visible').count(), 0, 'Combo interaction must not reveal native selects');'''
          new_combo = '''  await page.locator('.section-tab[data-goto="10"]').click();
  const comboRow = page.locator('.section[data-section="10"] .combo-row').first();
  const comboSelects = comboRow.locator('select[data-answer]');
  assert.ok(await comboSelects.count() >= 2, 'Combo Builder should keep compact native selects');
  assert.ok(await comboSelects.first().isVisible(), 'Combo Builder selects should be visible');
  const firstOptions = await comboSelects.first().locator('option').evaluateAll(options => options.map(option => option.value).filter(Boolean));
  assert.ok(firstOptions.length <= 5, 'First Combo Builder select must stay compact');
  assert.ok(firstOptions.every(value => ['Ctrl','Shift','Alt','AltGr','Win'].includes(value)), 'First Combo Builder select may only contain modifier keys');
  const lastOptions = await comboSelects.last().locator('option').evaluateAll(options => options.map(option => option.value).filter(Boolean));
  assert.ok(lastOptions.length <= 6, 'Final Combo Builder select must stay compact');
  assert.equal(await comboRow.locator('.a8-combo-bank-option').count(), 0, 'Old shared button bank must be removed');
  const comboAnswer = await comboSelects.first().getAttribute('data-answer');
  assert.ok(comboAnswer);
  await comboSelects.first().selectOption(comboAnswer);
  assert.equal(await comboSelects.first().inputValue(), comboAnswer, 'Filtered Combo Builder select must accept the correct modifier');'''
          if old_combo not in test:
            raise SystemExit('Expected old Combo Builder QA block not found')
          test = test.replace(old_combo, new_combo)
          test = test.replace(
"  assert.equal(await page.locator('#learnSections select:visible').count(), 0, 'No native dropdown may become visible after all sections unlock');",
"  assert.equal(await page.locator('#learnSections select:visible').count(), 0, 'No dropdown should be visible while a non-Combo section is active');")
          test = test.replace(
"  assert.equal(await page.locator('#learnSections select:visible').count(), 0, 'Native selects must remain hidden on mobile');",
"  assert.equal(await page.locator('#learnSections select:visible').count(), 0, 'No dropdown should be visible on mobile while a non-Combo section is active');")
          test = test.replace('button-only choices, RPG progression and mobile layout.', 'filtered Combo Builder selects, button choices, RPG progression and mobile layout.')
          q.write_text(test, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 2026/skill-hotkeys.js 2026/qa/browser-smoke.mjs
          git commit -m "A8: simplify Combo Builder dropdowns"
          git push origin HEAD:tk2-2026
