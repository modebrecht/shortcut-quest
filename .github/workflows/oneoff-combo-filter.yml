name: One-off Combo Builder Filter Pass

on:
  push:
    branches:
      - tk2-2026
    paths:
      - .github/workflows/oneoff-combo-filter.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tk2-2026
          fetch-depth: 1

      - name: Apply Combo Builder patch
        run: python3 2026/qa/apply_combo_filter_patch.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 2026/skill-hotkeys.js 2026/qa/browser-smoke.mjs
          git commit -m "A8: simplify Combo Builder dropdowns"
          git push origin HEAD:tk2-2026
