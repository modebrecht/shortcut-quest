name: One-off Modern Exercise States

on:
  push:
    branches: [tk2-2026]
    paths:
      - '.github/workflows/oneoff-modern-exercise-states.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tk2-2026
      - name: Harden exercise feedback states
        run: python3 2026/qa/append_modern_exercise_states.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 2026/modern-exercises.css
          git commit -m "A8: preserve clear exercise feedback states"
          git push origin HEAD:tk2-2026
