name: One-off A8 replay policy

on:
  push:
    branches: [tk2-2026]
    paths:
      - '.github/workflows/oneoff-replay-policy.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tk2-2026
          fetch-depth: 1

      - name: Apply patch
        run: python3 tools/oneoff_replay_patch.py

      - name: Commit patched runtime and clean helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/oneoff-replay-policy.yml tools/oneoff_replay_patch.py
          git add 2026/index.html 2026/modern-exercises.css 2026/qa/replay-policy-browser.mjs
          git commit -m 'feat: limit A8 replay rewards per section'
          git push origin HEAD:tk2-2026
