name: One-off A8 replay policy

on:
  push:
    branches: [tk2-2026]
    paths:
      - '.github/workflows/oneoff-replay-policy.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tk2-2026
          fetch-depth: 1

      - name: Apply replay economy policy
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('2026/index.html')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '    const COINS_PER_ACTION = 10;\n    const COINS_PER_ACTION_AFTER_RESET = 5;\n    const INITIAL_SECTION_UNLOCK = 10;',
              '    const COINS_PER_ACTION = 10;\n    const COINS_PER_ACTION_AFTER_RESET = 5;\n    const MAX_SECTION_SUBMISSIONS = 3;\n    const INITIAL_SECTION_UNLOCK = 10;',
              'constants'
          )

          replace_once(
              '      sectionClears: {},\n      sectionResets: {},\n      sectionReports: {},',
              '      sectionClears: {},\n      sectionResets: {},\n      sectionSubmissions: {},\n      replayCycle: 1,\n      sectionReports: {},',
              'state defaults'
          )

          replace_once(
              '      if (typeof state.sectionClears !== "object" || !state.sectionClears) state.sectionClears = {};\n      if (typeof state.sectionResets !== "object" || !state.sectionResets) state.sectionResets = {};\n      if (typeof state.sectionReports !== "object" || !state.sectionReports) state.sectionReports = {};',
              '      if (typeof state.sectionClears !== "object" || !state.sectionClears) state.sectionClears = {};\n      if (typeof state.sectionResets !== "object" || !state.sectionResets) state.sectionResets = {};\n      if (typeof state.sectionSubmissions !== "object" || !state.sectionSubmissions) state.sectionSubmissions = {};\n      if (!Number.isFinite(state.replayCycle) || state.replayCycle < 1) state.replayCycle = 1;\n      if (typeof state.sectionReports !== "object" || !state.sectionReports) state.sectionReports = {};',
              'state normalization'
          )

          save_anchor = '''    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function exportGameState() {'''
          save_replacement = '''    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function getSectionSubmissionCount(sectionId) {
      if (!sectionId || !state.sectionSubmissions) return 0;
      const value = Number(state.sectionSubmissions[String(sectionId)] || 0);
      return Math.max(0, Math.min(MAX_SECTION_SUBMISSIONS, Math.floor(Number.isFinite(value) ? value : 0)));
    }

    function sectionSubmissionExhausted(sectionId) {
      return getSectionSubmissionCount(sectionId) >= MAX_SECTION_SUBMISSIONS;
    }

    function resetSubmissionCycleIfComplete() {
      if (!Array.isArray(SECTION_BLUEPRINTS) || !SECTION_BLUEPRINTS.length) return false;
      const complete = SECTION_BLUEPRINTS.every((section, index) => {
        const id = resolveSectionId(section, index);
        return getSectionSubmissionCount(id) >= MAX_SECTION_SUBMISSIONS;
      });
      if (!complete) return false;
      state.sectionSubmissions = {};
      state.replayCycle = Math.max(1, Math.floor(Number(state.replayCycle) || 1)) + 1;
      return true;
    }

    function recordSectionSubmission(sectionId) {
      const id = String(sectionId || "");
      if (!id || sectionSubmissionExhausted(id)) return null;
      state.sectionSubmissions[id] = getSectionSubmissionCount(id) + 1;
      const count = getSectionSubmissionCount(id);
      const cycleReset = resetSubmissionCycleIfComplete();
      updateSectionSubmissionUI();
      return { count, cycleReset };
    }

    function updateSectionSubmissionUI() {
      if (typeof document === "undefined") return;
      const lockText = "3/3 Durchläufe gespielt – zuerst die anderen Abschnitte abschliessen.";
      document.querySelectorAll(".section[data-section]").forEach(section => {
        const id = String(section.dataset.section || "");
        const count = getSectionSubmissionCount(id);
        const exhausted = count >= MAX_SECTION_SUBMISSIONS;
        section.classList.toggle("submission-exhausted", exhausted);

        const header = section.querySelector(".card--section .card-header");
        if (header) {
          let badge = header.querySelector(".section-submission-badge");
          if (!badge) {
            badge = document.createElement("span");
            badge.className = "section-submission-badge";
            header.appendChild(badge);
          }
          badge.textContent = `Durchläufe ${count}/${MAX_SECTION_SUBMISSIONS}`;
          badge.title = exhausted ? lockText : "1. Durchlauf: 100% Coins · 2. und 3. Durchlauf: 50% Coins";
        }

        [section.querySelector(".check-section"), section.querySelector(".reset-section"), section.querySelector(".fast-paced-start")]
          .filter(Boolean)
          .forEach(control => {
            if (exhausted) {
              control.dataset.submissionLocked = "true";
              control.disabled = true;
              control.title = lockText;
            } else if (control.dataset.submissionLocked === "true") {
              delete control.dataset.submissionLocked;
              control.disabled = false;
              control.removeAttribute("title");
            }
          });
      });

      document.querySelectorAll(".section-tab").forEach(tab => {
        const id = String(tab.dataset.sectionId || tab.dataset.goto || "");
        const exhausted = sectionSubmissionExhausted(id);
        tab.classList.toggle("submission-exhausted", exhausted);
        if (exhausted) {
          tab.dataset.submissionLocked = "true";
          tab.disabled = true;
          tab.title = "3/3 Durchläufe gespielt";
        } else if (tab.dataset.submissionLocked === "true") {
          delete tab.dataset.submissionLocked;
          tab.disabled = false;
          tab.title = `Abschnitt ${id}`;
        }
      });
    }

    window.SHORTCUT_QUEST_2026_REPLAY_POLICY = Object.freeze({
      maxSubmissionsPerSection: MAX_SECTION_SUBMISSIONS,
      firstRewardPercent: 100,
      repeatRewardPercent: 50,
      resetCondition: "all-30-sections-reach-3"
    });

    function exportGameState() {'''
          replace_once(save_anchor, save_replacement, 'submission helpers')

          replace_once(
              '      updateLockedSectionsHint(targetCount < SECTION_BLUEPRINTS.length);\n      updateSectionCompletionClasses();\n    }',
              '      updateLockedSectionsHint(targetCount < SECTION_BLUEPRINTS.length);\n      updateSectionCompletionClasses();\n      updateSectionSubmissionUI();\n    }',
              'render submission ui'
          )

          fast_old = '''      function finishSession() {
        fastState.active = false;
        elements.startBtn.disabled = false;
        elements.startBtn.textContent = "Erneut starten";
        elements.prompt.textContent = `Ergebnis: ${fastState.correct}/${rounds}`;
        updateTimerDisplay(timeLimit);
        resetOptions();
        elements.root.classList.remove("fast-paced-active");
        updateHourglass(1);
        const reward = fastState.correct * COINS_PER_ACTION;
        const completionPercent = Math.round((fastState.correct / rounds) * 100);
        if (reward > 0) {
          const bonusPercent = getRunenAmuletCoinBonusPercent();
          const finalReward = applyCoinBonus(reward);
          state.coins += finalReward;
          pendingCoinAnimation = { amount: finalReward, anchor: elements.startBtn, variant: "gain" };
          const bonusText = bonusPercent ? ` (Runenbonus +${bonusPercent}%)` : "";
          showResult(`Belohnung: +${finalReward} Coins${bonusText}`, true);
        } else {
          showResult("Keine Coins in dieser Runde.", false);
        }
        if (completionPercent >= 70) {
          const currentClears = state.sectionClears[sectionId] || 0;
          state.sectionClears[sectionId] = Math.max(currentClears, 1);
          updateSectionCompletionClasses();
          saveState();
        }
        updateUI();
        updateOverallSummary();
        recalcStats();
        saveState();
      }'''
          fast_new = '''      function finishSession() {
        fastState.active = false;
        elements.startBtn.disabled = false;
        elements.startBtn.textContent = "Erneut starten";
        elements.prompt.textContent = `Ergebnis: ${fastState.correct}/${rounds}`;
        updateTimerDisplay(timeLimit);
        resetOptions();
        elements.root.classList.remove("fast-paced-active");
        updateHourglass(1);
        const completionPercent = Math.round((fastState.correct / rounds) * 100);
        if (completionPercent >= 70) {
          const currentClears = state.sectionClears[sectionId] || 0;
          const rewardRate = currentClears > 0 ? COINS_PER_ACTION_AFTER_RESET : COINS_PER_ACTION;
          const reward = fastState.correct * rewardRate;
          const bonusPercent = getRunenAmuletCoinBonusPercent();
          const finalReward = applyCoinBonus(reward);
          state.coins += finalReward;
          pendingCoinAnimation = { amount: finalReward, anchor: elements.startBtn, variant: "gain" };
          state.sectionClears[sectionId] = Math.max(currentClears, 1);
          const submission = recordSectionSubmission(sectionId);
          const bonusText = bonusPercent ? ` (Runenbonus +${bonusPercent}%)` : "";
          if (submission && submission.cycleReset) {
            showResult(`Belohnung: +${finalReward} Coins${bonusText} · Alle Abschnitte 3× gespielt – neue Runde!`, true);
          } else {
            const count = submission ? submission.count : getSectionSubmissionCount(sectionId);
            showResult(`Belohnung: +${finalReward} Coins${bonusText} · Durchlauf ${count}/${MAX_SECTION_SUBMISSIONS}`, true);
          }
          updateSectionCompletionClasses();
        } else {
          showResult("Unter 70% – keine Coins. Dieser Versuch zählt nicht als Durchlauf.", false);
        }
        updateUI();
        updateSectionSubmissionUI();
        updateOverallSummary();
        recalcStats();
        saveState();
      }'''
          replace_once(fast_old, fast_new, 'fast paced rewards')

          replace_once(
              '''      elements.startBtn.addEventListener("click", () => {
        resetSession();
        startSession();
      });''',
              '''      elements.startBtn.addEventListener("click", () => {
        if (sectionSubmissionExhausted(sectionId)) {
          showResult("3/3 Durchläufe gespielt – zuerst die anderen Abschnitte abschliessen.", false);
          updateSectionSubmissionUI();
          return;
        }
        resetSession();
        startSession();
      });''',
              'fast paced lock'
          )

          replace_once(
              '''    function gradeSection(sectionId, triggerBtn) {
      const section = document.querySelector(`.section[data-section="${sectionId}"]`);
      if (!section) return;''',
              '''    function gradeSection(sectionId, triggerBtn) {
      const section = document.querySelector(`.section[data-section="${sectionId}"]`);
      if (!section) return;
      if (sectionSubmissionExhausted(sectionId)) {
        const lockedResult = document.getElementById(`result-${sectionId}`);
        if (lockedResult) lockedResult.textContent = "3/3 Durchläufe gespielt – zuerst die anderen Abschnitte abschliessen.";
        updateSectionSubmissionUI();
        return;
      }''',
              'normal section lock'
          )

          reward_anchor = '''        } else if (clears > 0) {
          resultMsg += " | für mehr Coins erst zurücksetzen.";
        }
        if (isFirstClear && unlockNextSection()) {'''
          reward_replacement = '''        } else if (clears > 0) {
          resultMsg += " | für mehr Coins erst zurücksetzen.";
        }
        const submission = reward > 0 ? recordSectionSubmission(sectionId) : null;
        if (submission && submission.cycleReset) {
          resultMsg += " | Alle Abschnitte 3× gespielt – neue Runde freigeschaltet.";
        } else if (submission) {
          resultMsg += ` | Durchlauf ${submission.count}/${MAX_SECTION_SUBMISSIONS}`;
        }
        if (isFirstClear && unlockNextSection()) {'''
          replace_once(reward_anchor, reward_replacement, 'normal submission count')

          replace_once(
              '    initLearnSections();\n    window.addEventListener("resize", () => {',
              '    initLearnSections();\n    updateSectionSubmissionUI();\n    window.addEventListener("resize", () => {',
              'initial submission ui'
          )

          path.write_text(text, encoding='utf-8')

          css = Path('2026/modern-exercises.css')
          css_text = css.read_text(encoding='utf-8')
          marker = '/* A8 replay submission policy */'
          if marker not in css_text:
              css_text += '''\n\n/* A8 replay submission policy */
.section-submission-badge {
  margin-left: auto;
  flex: 0 0 auto;
  padding: .28rem .55rem;
  border: 1px solid rgba(148,163,184,.28);
  border-radius: 999px;
  background: rgba(15,23,42,.42);
  color: var(--muted);
  font-size: .72rem;
  font-weight: 800;
  white-space: nowrap;
}
.section.submission-exhausted .section-submission-badge,
.section-tab.submission-exhausted {
  opacity: .55;
}
.section.submission-exhausted .section-submission-badge {
  border-color: rgba(148,163,184,.18);
}
.section-tab.submission-exhausted {
  cursor: not-allowed;
  filter: saturate(.55);
}
@media (max-width: 560px) {
  .section-submission-badge { font-size: .68rem; padding: .24rem .45rem; }
}
'''
              css.write_text(css_text, encoding='utf-8')
          PY

          cat > 2026/qa/replay-policy-browser.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';

          const baseUrl = process.env.TK2_BASE_URL || 'http://127.0.0.1:4173/2026/';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });

          async function fresh() {
            await page.goto(baseUrl, { waitUntil: 'networkidle' });
            await page.evaluate(() => localStorage.clear());
            await page.reload({ waitUntil: 'networkidle' });
            await page.waitForFunction(() => window.SHORTCUT_QUEST_2026_REPLAY_POLICY?.maxSubmissionsPerSection === 3);
          }

          async function state() {
            return page.evaluate(() => JSON.parse(localStorage.getItem('shortcutRitter_v1')));
          }

          async function fillNarrative(sectionId) {
            await page.evaluate(id => {
              const section = document.querySelector(`.section[data-section="${id}"]`);
              if (!section) throw new Error(`Section ${id} missing`);
              section.querySelectorAll('.narrative-blank').forEach(blank => {
                const answer = blank.dataset.answer || '';
                blank.dataset.value = answer;
                blank.dataset.filled = 'true';
                blank.textContent = answer;
              });
            }, String(sectionId));
          }

          async function fillInputs(sectionId) {
            await page.evaluate(id => {
              const section = document.querySelector(`.section[data-section="${id}"]`);
              if (!section) throw new Error(`Section ${id} missing`);
              section.querySelectorAll('input[data-answer]').forEach(input => {
                input.value = input.dataset.answer || '';
                input.dispatchEvent(new Event('input', { bubbles: true }));
              });
            }, String(sectionId));
          }

          async function playFastPerfect(sectionId, rounds) {
            const section = page.locator(`.section[data-section="${sectionId}"]`);
            const start = section.locator('.fast-paced-start');
            await start.click();
            for (let i = 0; i < rounds; i += 1) {
              await page.waitForFunction(id => {
                const root = document.querySelector(`.section[data-section="${id}"]`);
                return root && Array.from(root.querySelectorAll('.fast-paced-option')).some(btn => !btn.disabled);
              }, String(sectionId));
              await page.evaluate(id => {
                const root = document.querySelector(`.section[data-section="${id}"]`);
                const prompt = root.querySelector('.fast-paced-prompt')?.textContent?.trim() || '';
                const blueprint = window.LEARN_SECTION_BLUEPRINTS.find(section => String(section.id) === String(id));
                const match = blueprint?.fastPaced?.combos?.find(entry => entry.label === prompt);
                if (!match) throw new Error(`Fast prompt not mapped: ${prompt}`);
                const button = Array.from(root.querySelectorAll('.fast-paced-option')).find(btn => btn.dataset.combo === match.combo);
                if (!button) throw new Error(`Correct option not found for ${prompt}`);
                button.click();
              }, String(sectionId));
              await page.waitForTimeout(650);
            }
            await page.waitForFunction(id => {
              const root = document.querySelector(`.section[data-section="${id}"]`);
              const btn = root?.querySelector('.fast-paced-start');
              return btn && btn.textContent.includes('Erneut starten');
            }, String(sectionId));
          }

          try {
            await fresh();
            assert.deepEqual(await page.evaluate(() => window.SHORTCUT_QUEST_2026_REPLAY_POLICY), {
              maxSubmissionsPerSection: 3,
              firstRewardPercent: 100,
              repeatRewardPercent: 50,
              resetCondition: 'all-30-sections-reach-3'
            });

            // Normal section: first clear 100%, two reset replays 50%, then lock.
            const s1 = page.locator('.section[data-section="1"]');
            await fillNarrative(1);
            await s1.locator('.check-section').click();
            await page.waitForTimeout(120);
            let saved = await state();
            assert.equal(saved.coins, 70, 'Section 1 first clear should pay 100% = 70 coins');
            assert.equal(saved.sectionSubmissions['1'], 1);

            await s1.locator('.reset-section').click();
            await fillNarrative(1);
            await s1.locator('.check-section').click();
            await page.waitForTimeout(120);
            saved = await state();
            assert.equal(saved.coins, 105, 'Section 1 second rewarded clear should pay 50% = 35 coins');
            assert.equal(saved.sectionSubmissions['1'], 2);

            await s1.locator('.reset-section').click();
            await fillNarrative(1);
            await s1.locator('.check-section').click();
            await page.waitForTimeout(120);
            saved = await state();
            assert.equal(saved.coins, 140, 'Section 1 third rewarded clear should pay another 35 coins');
            assert.equal(saved.sectionSubmissions['1'], 3);
            assert.equal(await s1.locator('.check-section').isDisabled(), true, 'Section 1 should lock after 3 rewarded runs');
            assert.equal(await page.locator('.section-tab[data-section-id="1"]').isDisabled(), true, 'Section 1 tab should lock after 3 rewarded runs');

            // Fast-paced uses the exact same 100/50/50 policy and locks after run 3.
            await fresh();
            await page.locator('.section-tab[data-section-id="2"]').click();
            for (const expected of [70, 105, 140]) {
              await playFastPerfect(2, 6);
              saved = await state();
              assert.equal(saved.coins, expected, `Fast-paced cumulative coins should be ${expected}`);
            }
            assert.equal(saved.sectionSubmissions['2'], 3);
            assert.equal(await page.locator('.section[data-section="2"] .fast-paced-start').isDisabled(), true, 'Fast-paced should lock after 3 rewarded runs');
            assert.equal(await page.locator('.section-tab[data-section-id="2"]').isDisabled(), true, 'Fast-paced tab should lock after 3 rewarded runs');

            // When the last of all 30 sections reaches 3/3, the replay cycle reopens everything.
            await fresh();
            await page.evaluate(() => {
              const saved = JSON.parse(localStorage.getItem('shortcutRitter_v1'));
              saved.sectionsUnlocked = 30;
              saved.sectionSubmissions = {};
              for (let i = 1; i <= 29; i += 1) saved.sectionSubmissions[String(i)] = 3;
              saved.sectionSubmissions['30'] = 2;
              saved.replayCycle = 1;
              saved.sectionClears = saved.sectionClears || {};
              saved.sectionClears['30'] = 1;
              saved.sectionResets = saved.sectionResets || {};
              saved.sectionResets['30'] = 1;
              localStorage.setItem('shortcutRitter_v1', JSON.stringify(saved));
            });
            await page.reload({ waitUntil: 'networkidle' });
            await page.locator('.section-stage-button[data-stage="2"]').click();
            await page.locator('.section-tab[data-section-id="30"]').click();
            await fillInputs(30);
            await page.locator('.section[data-section="30"] .check-section').click();
            await page.waitForTimeout(150);
            saved = await state();
            assert.equal(saved.replayCycle, 2, 'Completing the 30th 3/3 should start replay cycle 2');
            assert.equal(Object.keys(saved.sectionSubmissions).length, 0, 'New replay cycle should clear all per-section counters');
            assert.equal(await page.locator('.section-tab[data-section-id="30"]').isDisabled(), false, 'Sections should reopen after the global 3/3 cycle is complete');

            console.log('REPLAY POLICY OK: 100/50/50, max 3 rewarded runs per section, global reopen after all 30 reach 3/3.');
          } finally {
            await browser.close();
          }
          EOF

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/oneoff-replay-policy.yml
          git add 2026/index.html 2026/modern-exercises.css 2026/qa/replay-policy-browser.mjs
          git commit -m 'feat: limit A8 replay rewards per section'
          git push origin HEAD:tk2-2026
