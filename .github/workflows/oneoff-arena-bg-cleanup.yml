name: One-off arena background cleanup

on:
  push:
    branches: [tk2-2026]
    paths:
      - '.github/workflows/oneoff-arena-bg-cleanup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tk2-2026
          fetch-depth: 0
      - name: Apply arena background cleanup
        run: bash .github/scripts/arena-bg-cleanup.sh
      - name: Commit result and remove helpers
        run: |
          git rm .github/workflows/oneoff-arena-bg-cleanup.yml .github/scripts/arena-bg-cleanup.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 2026/modern-battle.css
          git commit -m 'style: simplify arena background behind fighters'
          git push origin HEAD:tk2-2026
