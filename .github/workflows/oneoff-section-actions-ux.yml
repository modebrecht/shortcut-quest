name: One-off Section Actions UX

on:
  push:
    branches: [tk2-2026]
    paths:
      - '.github/workflows/oneoff-section-actions-ux.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tk2-2026
      - name: Apply section action UX patch
        shell: bash
        run: |
          python3 2026/qa/patch_section_actions.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('2026/index.html')
          text = path.read_text(encoding='utf-8-sig').replace('\r\n', '\n').replace('\r', '\n')
          path.write_bytes(text.replace('\n', '\r\n').encode('utf-8-sig'))
          PY
      - name: Verify patch
        run: |
          grep -q 'section-actions' 2026/index.html
          grep -q 'updateCheckReadyState' 2026/index.html
          grep -q 'sq-ready-check-pulse' 2026/modern-exercises.css
          ! grep -q 'checkBtn.textContent = `✅' 2026/index.html
          ! grep -q 'resetBtn.textContent = `🔄' 2026/index.html
      - name: Commit runtime changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 2026/index.html 2026/modern-exercises.css
          git diff --cached --stat
          git commit -m "A8: integrate section check actions into task card"
          git push origin HEAD:tk2-2026
