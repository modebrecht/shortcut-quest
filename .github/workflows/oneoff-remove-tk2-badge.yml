name: One-off Remove TK2 Badge

on:
  push:
    branches: [tk2-2026]
    paths:
      - '.github/workflows/oneoff-remove-tk2-badge.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tk2-2026
      - name: Apply patch
        run: python3 2026/qa/remove_badge.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 2026/skill-hotkeys.js
          git commit -m "A8: remove TK2 edition badge"
          git push origin HEAD:tk2-2026
