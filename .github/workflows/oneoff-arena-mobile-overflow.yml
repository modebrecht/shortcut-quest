name: One-off arena mobile overflow fix
on:
  push:
    branches: [tk2-2026]
    paths: [.github/workflows/oneoff-arena-mobile-overflow.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tk2-2026
          fetch-depth: 1
      - name: Fix mobile arena overflow
        run: |
          cat >> 2026/modern-battle.css <<'EOF'

          /* SINGLE ARENA MOBILE OVERFLOW GUARD */
          #battleView .battle-overview {
            overflow: hidden !important;
          }
          #battleView .battle-side,
          #battleView .battle-side-head,
          #battleView .battle-statline,
          #battleView .battle-portrait,
          #battleView .battle-portrait-icon {
            min-width: 0 !important;
            max-width: 100% !important;
            box-sizing: border-box !important;
          }
          @media (max-width: 460px) {
            #battleView .battle-side,
            #battleView .battle-side.hero,
            #battleView .battle-side.enemy {
              width: 41% !important;
              height: 248px !important;
            }
            #battleView .battle-side-head {
              width: 100% !important;
              max-width: 100% !important;
              overflow: hidden !important;
            }
            #battleView .battle-side-head > * {
              min-width: 0 !important;
              max-width: 100% !important;
            }
            #battleView .battle-side-tier,
            #battleView .battle-trait {
              max-width: 100% !important;
              overflow: hidden !important;
              text-overflow: ellipsis !important;
              white-space: nowrap !important;
            }
            #battleView .battle-statline {
              max-width: 100% !important;
              overflow: hidden !important;
            }
          }
          EOF
          rm .github/workflows/oneoff-arena-mobile-overflow.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 2026/modern-battle.css .github/workflows/oneoff-arena-mobile-overflow.yml
          git commit -m "fix: contain single arena on mobile"
          git push origin HEAD:tk2-2026
