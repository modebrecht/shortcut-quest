name: One-off A8 3x replay invariant

on:
  push:
    branches: [tk2-2026]
    paths:
      - '.github/workflows/oneoff-replay-3x-e2e.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tk2-2026
          fetch-depth: 1

      - name: Apply replay policy patch
        shell: bash
        run: |
          python3 -c "import base64;exec(base64.b64decode('').decode())"

      - name: Write full replay E2E
        shell: bash
        run: |
          printf '%s' '' | base64 -d > 2026/qa/replay-policy-browser.mjs

      - name: Commit runtime and E2E, remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/oneoff-replay-3x-e2e.yml
          git add 2026/index.html 2026/qa/replay-policy-browser.mjs
          git diff --cached --check
          git commit -m "fix: enforce full 3x replay cycle"
          git push origin HEAD:tk2-2026
