name: One-off Level Chooser

on:
  push:
    branches: [tk2-2026]
    paths:
      - '.github/workflows/oneoff-level-chooser.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tk2-2026
      - name: Apply level chooser patch
        run: python3 2026/qa/patch_level_chooser.py
      - name: Verify syntax
        run: |
          node --check 2026/skill-hotkeys.js
          node --check 2026/qa/browser-smoke.mjs
      - name: Commit runtime and smoke changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 2026/skill-hotkeys.js 2026/modern-ui.css 2026/qa/browser-smoke.mjs
          git commit -m "A8: redesign section chooser as level selector"
          git push origin HEAD:tk2-2026
