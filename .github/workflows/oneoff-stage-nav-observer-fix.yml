name: One-off Stage Nav Observer Fix

on:
  push:
    branches: [tk2-2026]
    paths:
      - '.github/workflows/oneoff-stage-nav-observer-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tk2-2026
      - name: Apply observer fix
        run: python3 2026/qa/patch_stage_nav_observer.py
      - name: Verify observer fix
        run: |
          node --check 2026/skill-hotkeys.js
          grep -q 'if (label.textContent !== targetLabel)' 2026/skill-hotkeys.js
      - name: Commit runtime change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 2026/skill-hotkeys.js
          git commit -m "A8: stabilize 30-section stage navigation"
          git push origin HEAD:tk2-2026
