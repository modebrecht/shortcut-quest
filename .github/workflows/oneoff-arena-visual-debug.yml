name: One-off arena visual debug
on:
  push:
    branches: [tk2-2026]
    paths: ['.github/workflows/oneoff-arena-visual-debug.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Capture deployed DEV arena
        run: |
          cat > capture-arena.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:1790,height:900}, deviceScaleFactor:1});
          const url = 'https://modebrecht.github.io/ib2026/dev/tk2/A8/?visualDebug=' + Date.now();
          await page.goto(url,{waitUntil:'networkidle'});
          await page.evaluate(() => {
            const btn=document.querySelector('.nav-toggle[data-view="battle"]');
            if (btn) btn.click();
          });
          await page.waitForTimeout(1200);
          const stage = page.locator('#battleStagePreview');
          await stage.waitFor({state:'visible'});
          await stage.screenshot({path:'deployed-arena.png'});
          const state = await page.evaluate(() => {
            const el=document.querySelector('#battleStagePreview');
            const b=getComputedStyle(el);
            const before=getComputedStyle(el,'::before');
            const after=getComputedStyle(el,'::after');
            return {
              backgroundImage:b.backgroundImage,
              backgroundColor:b.backgroundColor,
              before:{content:before.content,display:before.display,background:before.background,opacity:before.opacity,z:before.zIndex},
              after:{content:after.content,display:after.display,background:after.background,opacity:after.opacity,z:after.zIndex},
              rect:el.getBoundingClientRect().toJSON()
            };
          });
          console.log('VISUAL_STATE '+JSON.stringify(state));
          await browser.close();
          NODE
          node capture-arena.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: arena-visual-debug
          path: |
            deployed-arena.png
            2026/assets/arena-premium.jpg
