name: Apply Battle V2

on:
  push:
    branches: [battle-v2-actual]
    paths:
      - '.github/workflows/apply-battle-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: battle-v2-actual
          fetch-depth: 1

      - name: Refactor battle engine
        run: python3 .github/battle-v2-patch.py

      - name: Static Battle V2 contract
        run: |
          grep -Fq 'const BATTLE_ENGINE_V2_STATE = {' 2026/index.html
          grep -Fq 'function resolveBattleTurn(hero, enemy, heroTurn)' 2026/index.html
          grep -Fq 'function presentBattleTurn(turn)' 2026/index.html
          grep -Fq 'Battle run was superseded by a newer session.' 2026/index.html
          grep -Fq 'Battle safety stop after' 2026/index.html
          grep -Fq 'BATTLE_ENGINE_V2_STATE.phase === "fighting"' 2026/index.html

      - name: Commit Battle V2
        run: |
          git config user.name 'modebrecht'
          git config user.email '137332207+modebrecht@users.noreply.github.com'
          git add 2026/index.html
          git commit -m 'refactor: separate A8 battle engine from presentation'
          git push origin HEAD:battle-v2-actual
