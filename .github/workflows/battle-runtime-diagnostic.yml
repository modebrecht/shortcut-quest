name: Battle Runtime Diagnostic

on:
  push:
    branches:
      - tk2-2026
  workflow_dispatch:

permissions:
  contents: read

jobs:
  battle-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Serve app
        run: |
          python3 -m http.server 4173 >/tmp/a8-http.log 2>&1 &
          sleep 2
      - name: Diagnose battle with full equipment
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const errors = [];
            page.on('pageerror', e => errors.push('PAGEERROR ' + String(e.stack || e)));
            page.on('console', m => { if (m.type() === 'error') errors.push('CONSOLE ' + m.text()); });
            await page.goto('http://127.0.0.1:4173/2026/', { waitUntil: 'networkidle' });
            await page.addStyleTag({ url: 'http://127.0.0.1:4173/2026/arena-dev-tuning.css' });
            for (const script of ['premium-motion.js','battle-motion.js','arena-dev-fix.js','a8-dev-polish.js']) {
              await page.addScriptTag({ url: 'http://127.0.0.1:4173/2026/' + script });
            }
            await page.evaluate(() => {
              const now = Date.now();
              const item = (key, name, icon, slot, category, atk = 0, def = 0, hp = 0) => ({
                id: `${key}-${now}`, key, name, icon, slot, category, theme: 'knight', description: '',
                baseAtk: atk, baseDef: def, baseHp: hp, atk, def, hp, tier: 1, totalCopies: 1,
                createdAt: now, lastObtainedAt: now
              });
              localStorage.setItem('shortcutRitter_v1', JSON.stringify({
                items: [
                  item('feuer_klinge','Feuerklinge','sword_fire','weapon','weapon',4,0),
                  item('stahl_sword','Stahlklinge','sword_steel','weapon','weapon',3,0),
                  item('taktik_helm','Taktikhelm','helm','helm','armor',1,1),
                  item('panzerhandschuhe','Panzerhandschuhe','panzerhandschuhe','gloves','armor',0,1),
                  item('runen_amulet','Runen-Amulett','talisman','necklace','accessory'),
                  item('stahl_stiefel','Stahl-Stiefel','stahl-stiefel','boots','armor',0,2),
                  item('lebens_ring','Lebensring','lebensring','ring_left','accessory',0,0,20),
                  item('gluecks_ring','Glücksring','gluecksring','ring_right','accessory')
                ],
                equipment: {}
              }));
            });
            await page.reload({ waitUntil: 'networkidle' });
            await page.addStyleTag({ url: 'http://127.0.0.1:4173/2026/arena-dev-tuning.css' });
            for (const script of ['premium-motion.js','battle-motion.js','arena-dev-fix.js','a8-dev-polish.js']) {
              await page.addScriptTag({ url: 'http://127.0.0.1:4173/2026/' + script });
            }
            await page.locator('.nav-toggle[data-view="inventory"]').click();
            await page.locator('#autoEquipBtn').click();
            await page.waitForTimeout(250);
            await page.locator('.nav-toggle[data-view="battle"]').click();
            await page.waitForTimeout(350);
            await page.locator('#battleStartBtn').click();
            await page.waitForTimeout(250);
            const report = await page.evaluate(() => {
              const sim = document.getElementById('battleSimulation');
              const arena = document.getElementById('battleArena');
              const knight = document.getElementById('battleKnight');
              const enemy = document.getElementById('battleEnemy');
              const knightSprite = document.getElementById('battleKnightSprite');
              const enemySprite = document.getElementById('battleEnemySprite');
              const rect = el => el ? el.getBoundingClientRect() : null;
              const r = el => {
                const x = rect(el); if (!x) return null;
                return {left:x.left,top:x.top,right:x.right,bottom:x.bottom,width:x.width,height:x.height};
              };
              const css = el => el ? getComputedStyle(el) : null;
              return {
                simVisible: !!sim && !sim.classList.contains('hidden') && rect(sim).width > 0 && rect(sim).height > 0,
                arena: r(arena), knight: r(knight), enemy: r(enemy), knightSprite: r(knightSprite), enemySprite: r(enemySprite),
                arenaOverflowX: arena ? arena.scrollWidth - arena.clientWidth : null,
                arenaOverflowY: arena ? arena.scrollHeight - arena.clientHeight : null,
                knightDisplay: css(knight)?.display || null,
                enemyDisplay: css(enemy)?.display || null,
                knightSpriteSrc: knightSprite?.getAttribute('src') || null,
                enemySpriteSrc: enemySprite?.getAttribute('src') || null,
                knightTransform: css(knight)?.transform || null,
                enemyTransform: css(enemy)?.transform || null,
                knightSpriteTransform: css(knightSprite)?.transform || null,
                enemySpriteTransform: css(enemySprite)?.transform || null,
                result: document.getElementById('battleResult')?.textContent?.trim() || '',
                skillBarVisible: !!document.getElementById('battleSkillBar') && !document.getElementById('battleSkillBar').hidden,
                startDisabled: document.getElementById('battleStartBtn')?.disabled || false
              };
            });
            console.log('BATTLE_REPORT=' + JSON.stringify(report));
            console.log('BROWSER_ERRORS=' + JSON.stringify(errors));
            await page.locator('#battleSimulation').screenshot({ path: 'battle-runtime.png' });
            assert.equal(report.simVisible, true, 'battle simulation must be visible after start');
            assert.ok(report.arena && report.arena.width > 600 && report.arena.height > 300, 'battle arena must have usable dimensions');
            assert.ok(report.knightSprite && report.knightSprite.width > 80 && report.knightSprite.height > 80, 'knight sprite must be visible');
            assert.ok(report.enemySprite && report.enemySprite.width > 80 && report.enemySprite.height > 80, 'enemy sprite must be visible');
            assert.deepEqual(errors, [], 'battle must not emit browser errors');
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
      - name: Upload battle screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battle-runtime-diagnostic
          path: battle-runtime.png
          if-no-files-found: warn
          retention-days: 1
