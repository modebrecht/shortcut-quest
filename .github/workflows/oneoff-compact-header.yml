name: One-off Compact Header Fix

on:
  push:
    branches: [tk2-2026]
    paths:
      - '.github/workflows/oneoff-compact-header.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tk2-2026
      - name: Apply compact header fix
        run: python3 2026/qa/patch_compact_header.py
      - name: Verify syntax and guards
        run: |
          node --check 2026/qa/browser-smoke.mjs
          grep -q 'RESPONSIVE COMPACT HEADER' 2026/modern-ui.css
          grep -q 'Tablet/compact desktop should use the menu button' 2026/qa/browser-smoke.mjs
      - name: Commit runtime and smoke changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 2026/modern-ui.css 2026/qa/browser-smoke.mjs
          git commit -m "A8: prevent compact header collisions"
          git push origin HEAD:tk2-2026
