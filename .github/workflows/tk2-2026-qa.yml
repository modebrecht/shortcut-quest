name: TK2 2026 QA

on:
  push:
    branches: [tk2-2026]
    paths:
      - '2026/**'
      - '.github/workflows/tk2-2026-qa.yml'

concurrency:
  group: tk2-2026-qa
  cancel-in-progress: true

jobs:
  static-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript syntax
        run: |
          node --check 2026/sections-data.js
          node --check 2026/skill-hotkeys.js
          node --check 2026/qa/browser-smoke.mjs
          node --check 2026/qa/economy-audit.mjs
          node --check 2026/qa/economy-browser.mjs
          node --check 2026/qa/replay-policy-browser.mjs
          node --check 2026/qa/hint-coverage-browser.mjs
          node --check 2026/qa/section-quality-browser.mjs

      - name: Curated course invariants
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const code = fs.readFileSync('2026/sections-data.js', 'utf8');
          const sandbox = {};
          vm.createContext(sandbox);
          vm.runInContext(code, sandbox, { filename: '2026/sections-data.js' });
          const sections = sandbox.LEARN_SECTION_BLUEPRINTS;
          if (!Array.isArray(sections)) throw new Error('LEARN_SECTION_BLUEPRINTS missing');
          if (sections.length !== 30) throw new Error(`Expected 30 sections, got ${sections.length}`);
          sections.forEach((section, index) => {
            const expected = String(index + 1);
            if (String(section.id) !== expected) throw new Error(`Section id mismatch at ${index}: ${section.id}`);
            if (section.memoryGame) throw new Error(`Memory must not exist in 2026 path: section ${section.id}`);
            const hasActivity = (Array.isArray(section.tasks) && section.tasks.length > 0)
              || section.fastPaced || section.narrative || section.comboBuilder;
            if (!hasActivity) throw new Error(`Section ${section.id} has no activity`);
          });
          const workflowSections = sections.filter(section => /Workflow Chain/i.test(section.title || ''));
          if (workflowSections.length < 4) throw new Error(`Expected at least 4 Workflow Chain sections, got ${workflowSections.length}`);
          for (const section of workflowSections) {
            const builder = section.comboBuilder;
            if (!builder || !Array.isArray(builder.combos)) throw new Error(`Workflow section ${section.id} missing Combo Builder data`);
            const options = new Set((builder.defaultOptions || []).map(String));
            for (const combo of builder.combos) {
              for (const answer of combo.answers || []) {
                if (!options.has(String(answer))) throw new Error(`Workflow ${section.id}: answer ${answer} missing from selectable options`);
              }
            }
          }
          console.log(`OK: ${sections.length} sections; ${workflowSections.length} Workflow Chain sections; no Memory.`);
          NODE

      - name: Reward economy audit
        run: node 2026/qa/economy-audit.mjs

      - name: Runtime file contract
        run: |
          test -f 2026/index.html
          test -f 2026/sections-data.js
          test -f 2026/skill-hotkeys.js
          test -f 2026/modern-ui.css
          test -f 2026/modern-exercises.css
          test -f 2026/modern-game.css
          test -f 2026/modern-battle.css
          test -f 2026/modern-report.css
          test -f 2026/apexcharts.min.js
          test -f 2026/favicon.svg
          test -f 2026/qa/browser-smoke.mjs
          test -f 2026/qa/economy-audit.mjs
          test -f 2026/qa/economy-browser.mjs
          test -f 2026/qa/replay-policy-browser.mjs
          test -f 2026/qa/hint-coverage-browser.mjs
          test -f 2026/qa/section-quality-browser.mjs
          test -d 2026/assets
          grep -q 'src="sections-data.js"' 2026/index.html
          grep -q 'src="skill-hotkeys.js"' 2026/index.html
          grep -q 'modern-ui.css' 2026/skill-hotkeys.js
          grep -q 'modern-exercises.css' 2026/skill-hotkeys.js
          grep -q 'modern-game.css' 2026/skill-hotkeys.js
          grep -q 'modern-battle.css' 2026/skill-hotkeys.js
          grep -q 'modern-report.css' 2026/modern-game.css
          grep -q 'shortcutRitter_2026_v1' 2026/skill-hotkeys.js
          grep -q 'tk_global_xp_v1' 2026/skill-hotkeys.js
          grep -q 'HINT_COST_XP_2026 = 30' 2026/skill-hotkeys.js
          grep -q 'SHORTCUT_QUEST_2026_HINT_COVERAGE' 2026/skill-hotkeys.js
          grep -q 'nodeNeedsUpgrade' 2026/skill-hotkeys.js
          grep -q 'MAX_SECTION_SUBMISSIONS = 3' 2026/index.html
          grep -q 'SHORTCUT_QUEST_2026_REPLAY_POLICY' 2026/index.html
          grep -q 'SINGLE ARENA COMPOSITION FIX' 2026/modern-battle.css
          ! grep -Fq 'new MutationObserver(() => queueMicrotask(() =>' 2026/skill-hotkeys.js
          ! grep -q 'memoryGame:' 2026/sections-data.js

      - name: Vercel autodeploy stays disabled
        run: |
          node -e "const v=require('./vercel.json'); if(v.git?.deploymentEnabled!==false) process.exit(1)"

  browser-smoke:
    needs: static-qa
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Chromium smoke dependency
        run: |
          npm install --no-save playwright
          # GitHub's Ubuntu image already contains Chromium runtime libraries.
          # Avoid --with-deps here: that unnecessarily hits the external Google
          # APT index, which can transiently publish mismatched Packages hashes.
          npx playwright install chromium

      - name: Serve TK2 2026 locally
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/tk2-2026-http.log 2>&1 &
          echo $! > /tmp/tk2-2026-http.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/2026/ >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/tk2-2026-http.log
          exit 1

      - name: Browser E2E smoke
        run: node 2026/qa/browser-smoke.mjs

      - name: Economy browser gate
        run: node 2026/qa/economy-browser.mjs

      - name: Replay policy browser gate
        run: node 2026/qa/replay-policy-browser.mjs

      - name: Hint coverage browser gate
        run: node 2026/qa/hint-coverage-browser.mjs

      - name: All-section quality browser gate
        run: node 2026/qa/section-quality-browser.mjs

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/tk2-2026-http.log || true
