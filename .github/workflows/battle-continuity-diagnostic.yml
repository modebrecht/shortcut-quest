name: Battle Continuity Diagnostic

on:
  push:
    branches: [tmp-battle-continuity-debug]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Serve app
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/a8-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/2026/ >/dev/null; then exit 0; fi
            sleep .5
          done
          exit 1
      - name: Isolate continuity culprit
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const scenarios = [
              ['base', []],
              ['premium', ['premium-motion.js']],
              ['battle-motion', ['battle-motion.js']],
              ['arena-fix', ['arena-dev-fix.js']],
              ['premium+battle', ['premium-motion.js','battle-motion.js']],
              ['battle+arena', ['battle-motion.js','arena-dev-fix.js']],
              ['all-no-polish', ['premium-motion.js','battle-motion.js','arena-dev-fix.js']],
              ['all', ['premium-motion.js','battle-motion.js','arena-dev-fix.js','a8-dev-polish.js']]
            ];
            for (const [name, scripts] of scenarios) {
              const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
              const errors = [];
              page.on('pageerror', e => errors.push('PAGEERROR ' + String(e.stack || e)));
              page.on('console', m => { if (m.type() === 'error') errors.push('CONSOLE ' + m.text()); });
              await page.goto('http://127.0.0.1:4173/2026/', { waitUntil: 'networkidle' });
              if (scripts.includes('arena-dev-fix.js')) {
                await page.addStyleTag({ url: 'http://127.0.0.1:4173/2026/arena-dev-tuning.css' });
              }
              for (const script of scripts) await page.addScriptTag({ url: 'http://127.0.0.1:4173/2026/' + script });
              await page.locator('.nav-toggle[data-view="battle"]').click();
              await page.waitForTimeout(250);
              await page.locator('#battleStartBtn').click();
              const startPerf = await page.evaluate(() => performance.now());
              await page.waitForTimeout(2600);
              const state = await page.evaluate(() => ({
                perf: performance.now(),
                result: document.getElementById('battleResult')?.textContent?.trim() || '',
                heroHp: document.getElementById('battleHeroHpValue')?.textContent?.trim() || document.getElementById('heroHpValue')?.textContent?.trim() || '',
                enemyHp: document.getElementById('battleEnemyHpValue')?.textContent?.trim() || document.getElementById('enemyHpValue')?.textContent?.trim() || '',
                log: Array.from(document.querySelectorAll('#battleLog > *, .battle-log > *')).map(el => el.textContent?.trim()).filter(Boolean),
                knightClass: document.getElementById('battleKnight')?.className || '',
                enemyClass: document.getElementById('battleEnemy')?.className || ''
              }));
              console.log('SCENARIO=' + JSON.stringify({name, scripts, elapsed: state.perf - startPerf, ...state, errors}));
              await page.close();
            }
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
