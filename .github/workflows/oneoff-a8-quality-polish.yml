name: One-off A8 quality polish

on:
  push:
    branches: [tk2-2026]
    paths:
      - '.github/workflows/oneoff-a8-quality-polish.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tk2-2026
          fetch-depth: 1

      - name: Apply targeted copy and hint polish
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          sections = Path('2026/sections-data.js')
          text = sections.read_text(encoding='utf-8-sig')
          replacements = [
              ("[['Neues Dokument','Ctrl+N'],['Neuer Tab'", "[['Neues Browserfenster','Ctrl+N'],['Neuer Tab'"),
              ("Alle acht A4-Kürzel in einer schnellen Runde.", "Alle acht Browser-Kürzel in einer schnellen Runde."),
              ("Baue ein-, zwei- und dreiteilige Kombinationen aus Tastenbausteinen.", "Baue zwei- und dreiteilige Kombinationen aus Tastenbausteinen."),
              ("Dreiteilige Kombinationen und nahe Verwandte bauen.", "Anspruchsvolle zwei- und dreiteilige Kombinationen bauen."),
              ("['Zwischenablage','Win+V']", "['Zwischenablage-Verlauf','Win+V']"),
              ("Windows-Werkzeuge ohne Maus direkt aufrufen.", "Windows-Funktionen und Werkzeuge ohne Maus direkt aufrufen."),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing sections-data anchor: {old}')
              text = text.replace(old, new)
          sections.write_text(text, encoding='utf-8')

          hotkeys = Path('2026/skill-hotkeys.js')
          text = hotkeys.read_text(encoding='utf-8-sig')
          hint_replacements = [
              ('`💡 Tipp genutzt (-${HINT_COST_XP_2026} XP)`', '`Tipp genutzt · ${HINT_COST_XP_2026} XP`'),
              ('`💡 Tipp (-${HINT_COST_XP_2026} XP | Zu wenig XP)`', '`Tipp · ${HINT_COST_XP_2026} XP · Zu wenig XP`'),
              ('`💡 Tipp (-${HINT_COST_XP_2026} XP)`', '`Tipp kaufen · ${HINT_COST_XP_2026} XP`'),
          ]
          for old, new in hint_replacements:
              if old not in text:
                  raise SystemExit(f'missing hint anchor: {old}')
              text = text.replace(old, new)
          hotkeys.write_text(text, encoding='utf-8')
          PY

          git rm .github/workflows/oneoff-a8-quality-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 2026/sections-data.js 2026/skill-hotkeys.js
          git commit -m "fix: polish A8 section copy"
          git push origin HEAD:tk2-2026
