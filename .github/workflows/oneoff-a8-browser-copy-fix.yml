name: One-off A8 browser copy fix

on:
  push:
    branches: [tk2-2026]
    paths:
      - '.github/workflows/oneoff-a8-browser-copy-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tk2-2026
          fetch-depth: 1

      - name: Fix section 23 Ctrl+N label
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('2026/sections-data.js')
          text = path.read_text(encoding='utf-8-sig')
          section23 = "section(23,'Fast-Paced Browser','Alle acht Browser-Kürzel in einer schnellen Runde.',{fastPaced:fast(10,7,4,[\n      ['Neues Dokument','Ctrl+N']"
          replacement = "section(23,'Fast-Paced Browser','Alle acht Browser-Kürzel in einer schnellen Runde.',{fastPaced:fast(10,7,4,[\n      ['Neues Browserfenster','Ctrl+N']"
          if text.count(section23) != 1:
              raise SystemExit(f'expected one section 23 Ctrl+N anchor, found {text.count(section23)}')
          path.write_text(text.replace(section23, replacement), encoding='utf-8')
          PY

          git rm .github/workflows/oneoff-a8-browser-copy-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 2026/sections-data.js
          git commit -m "fix: label browser Ctrl+N correctly"
          git push origin HEAD:tk2-2026
