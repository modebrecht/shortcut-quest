name: One-off Choice Density

on:
  push:
    branches: [tk2-2026]
    paths:
      - '.github/workflows/oneoff-choice-density.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tk2-2026
      - name: Apply choice density patch
        run: python3 2026/qa/patch_choice_density.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 2026/skill-hotkeys.js
          git commit -m "A8: cap choice questions at four options"
          git push origin HEAD:tk2-2026
