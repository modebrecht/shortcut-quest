name: One-off deployed arena capture
on:
  push:
    branches: [tk2-2026]
    paths: ['.github/workflows/oneoff-deployed-arena-capture.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Capture real deployed DEV arena
        run: |
          cat > capture.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:1790,height:900}, deviceScaleFactor:1});
          await page.goto('https://modebrecht.github.io/ib2026/dev/tk2/A8/?arenaVerify=' + Date.now(), {waitUntil:'networkidle'});
          await page.evaluate(() => {
            const button=document.querySelector('.nav-toggle[data-view="battle"]');
            if (!button) throw new Error('battle nav missing');
            button.click();
          });
          await page.waitForFunction(() => document.getElementById('battleView')?.classList.contains('active'));
          await page.waitForTimeout(700);
          await page.locator('#battleStagePreview').screenshot({path:'deployed-arena-after.png'});
          const computed = await page.locator('#battleStagePreview').evaluate(el => ({
            backgroundImage:getComputedStyle(el).backgroundImage,
            backgroundColor:getComputedStyle(el).backgroundColor,
            width:el.getBoundingClientRect().width,
            height:el.getBoundingClientRect().height
          }));
          console.log('DEPLOYED_ARENA_STATE=' + JSON.stringify(computed));
          await browser.close();
          NODE
          node capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: deployed-arena-after-grey-fix
          path: deployed-arena-after.png
