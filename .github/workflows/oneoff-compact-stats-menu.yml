name: One-off Compact Stats Menu Fix

on:
  push:
    branches: [tk2-2026]
    paths:
      - '.github/workflows/oneoff-compact-stats-menu.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tk2-2026
      - name: Apply compact stats menu fix
        run: python3 2026/qa/patch_compact_stats_menu.py
      - name: Verify syntax
        run: |
          node --check 2026/skill-hotkeys.js
          node --check 2026/qa/browser-smoke.mjs
      - name: Commit runtime and smoke changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 2026/index.html 2026/skill-hotkeys.js 2026/modern-ui.css 2026/qa/browser-smoke.mjs
          git commit -m "A8: move compact XP and coins into menu"
          git push origin HEAD:tk2-2026
