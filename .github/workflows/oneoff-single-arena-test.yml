name: One-off single arena smoke update

on:
  workflow_dispatch:
  push:
    branches:
      - tk2-2026
    paths:
      - .github/workflows/oneoff-single-arena-test.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tk2-2026
          fetch-depth: 1
      - name: Patch browser smoke
        run: python .tmp/patch-single-arena-test.py
      - name: Clean helper and commit
        run: |
          rm -f .tmp/patch-single-arena-test.py
          rm -f .github/workflows/oneoff-single-arena-test.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: validate premium single-arena stage'
          git push origin HEAD:tk2-2026
