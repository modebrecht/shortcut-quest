name: One-off premium single arena image

on:
  workflow_dispatch:
  push:
    branches:
      - tk2-2026
    paths:
      - .github/workflows/oneoff-single-arena-image.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tk2-2026
          fetch-depth: 1
      - name: Reconstruct arena image
        run: |
          set -e
          mkdir -p 2026/assets
          cat .tmp/arena800/00.txt .tmp/arena800/01.txt .tmp/arena800/02.txt .tmp/arena800/03.txt .tmp/arena800/04.txt | tr -d '\n\r' | base64 -d > 2026/assets/arena-premium.jpg
          test -s 2026/assets/arena-premium.jpg
          test "$(wc -c < 2026/assets/arena-premium.jpg)" -gt 30000
      - name: Apply final arena CSS
        run: |
          set -e
          cat .tmp/single-arena.css >> 2026/modern-battle.css
      - name: Clean staging files
        run: |
          rm -rf .tmp/arena800 .tmp/arena_chunks .tmp/arena-premium.webp.b64 .tmp/single-arena.css
          rm -f .github/workflows/oneoff-single-arena-image.yml
      - name: Commit runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: build premium single-image arena stage'
          git push origin HEAD:tk2-2026
