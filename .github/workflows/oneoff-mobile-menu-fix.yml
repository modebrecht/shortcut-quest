name: One-off Mobile Menu Fix

on:
  push:
    branches: [tk2-2026]
    paths:
      - '.github/workflows/oneoff-mobile-menu-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tk2-2026
      - name: Apply mobile menu fix
        run: python3 2026/qa/patch_mobile_menu.py
      - name: Verify patch
        run: |
          node --check 2026/qa/browser-smoke.mjs
          grep -q 'touch-action: manipulation' 2026/modern-ui.css
          grep -q 'Mobile menu button should open the navigation' 2026/qa/browser-smoke.mjs
      - name: Commit runtime and smoke changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 2026/modern-ui.css 2026/qa/browser-smoke.mjs
          git commit -m "A8: fix clickable mobile menu"
          git push origin HEAD:tk2-2026
