name: One-off arena layout fix
on:
  push:
    branches: [tk2-2026]
    paths: [.github/workflows/oneoff-arena-layout-fix.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tk2-2026
          fetch-depth: 1
      - name: Apply arena composition fix
        run: |
          cat >> 2026/modern-battle.css <<'EOF'

          /* SINGLE ARENA COMPOSITION FIX — 2026-09-11
             Keep both fighters directly in the artwork; no portrait-card rectangles. */
          #battleView .battle-side,
          #battleView .battle-side.hero,
          #battleView .battle-side.enemy {
            position: absolute !important;
            top: clamp(112px, 8.5vw, 136px) !important;
            z-index: 8 !important;
            width: clamp(210px, 18vw, 270px) !important;
            height: clamp(370px, 31vw, 455px) !important;
            display: grid !important;
            grid-template-rows: auto minmax(0,1fr) auto !important;
            align-items: stretch !important;
            padding: 0 !important;
            border: 0 !important;
            border-radius: 0 !important;
            background: none !important;
            box-shadow: none !important;
            overflow: visible !important;
            pointer-events: none !important;
          }
          #battleView .battle-side.hero { left: clamp(28px, 4.2vw, 72px) !important; }
          #battleView .battle-side.enemy { right: clamp(28px, 4.2vw, 72px) !important; left: auto !important; }

          #battleView .battle-side::before,
          #battleView .battle-side::after,
          #battleView .battle-portrait::before,
          #battleView .battle-portrait-icon::before,
          #battleView .battle-portrait-icon::after {
            content: none !important;
            display: none !important;
          }

          #battleView .battle-side-head {
            justify-self: start !important;
            width: max-content !important;
            max-width: min(280px, 100%) !important;
            padding: .48rem .62rem !important;
            background: rgba(3,9,19,.70) !important;
            border: 1px solid rgba(148,163,184,.15) !important;
            border-radius: .78rem !important;
            box-shadow: 0 9px 22px rgba(2,6,23,.25) !important;
            backdrop-filter: blur(7px) !important;
          }
          #battleView .battle-side.enemy .battle-side-head {
            justify-self: end !important;
            margin-left: 0 !important;
            text-align: right !important;
          }

          #battleView .battle-portrait,
          #battleView .battle-portrait.hero,
          #battleView .battle-portrait.enemy,
          #battleView .battle-portrait-icon {
            align-self: end !important;
            width: 100% !important;
            height: 100% !important;
            min-height: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
            border: 0 !important;
            border-radius: 0 !important;
            background: transparent !important;
            background-image: none !important;
            box-shadow: none !important;
            overflow: visible !important;
          }

          #battleView .battle-portrait-icon img {
            display: block !important;
            width: 100% !important;
            height: 100% !important;
            max-width: 100% !important;
            max-height: 100% !important;
            object-fit: contain !important;
            object-position: center bottom !important;
            background: transparent !important;
            filter: drop-shadow(0 18px 18px rgba(0,0,0,.54)) !important;
          }
          #battleView .battle-side.hero .battle-portrait-icon img {
            transform: scale(.84) !important;
            transform-origin: 50% 100% !important;
          }
          #battleView .battle-side.enemy .battle-portrait-icon img {
            transform: scale(.92) !important;
            transform-origin: 50% 100% !important;
          }

          #battleView .battle-statline {
            align-self: end !important;
            width: max-content !important;
            max-width: 100% !important;
            margin: 0 !important;
            transform: translateY(-6px) !important;
            padding: .24rem .3rem !important;
            border: 1px solid rgba(148,163,184,.12) !important;
            border-radius: .68rem !important;
            background: rgba(3,9,19,.68) !important;
            box-shadow: 0 8px 20px rgba(2,6,23,.22) !important;
          }
          #battleView .battle-side.hero .battle-statline { justify-self: start !important; }
          #battleView .battle-side.enemy .battle-statline { justify-self: end !important; }

          @media (max-width: 980px) {
            #battleView .battle-side,
            #battleView .battle-side.hero,
            #battleView .battle-side.enemy {
              top: 106px !important;
              width: clamp(175px, 25vw, 220px) !important;
              height: 350px !important;
            }
            #battleView .battle-side.hero { left: 18px !important; }
            #battleView .battle-side.enemy { right: 18px !important; }
          }
          @media (max-width: 720px) {
            #battleView .battle-side,
            #battleView .battle-side.hero,
            #battleView .battle-side.enemy {
              top: 82px !important;
              width: 40% !important;
              height: 262px !important;
            }
            #battleView .battle-side.hero { left: 6px !important; }
            #battleView .battle-side.enemy { right: 6px !important; }
            #battleView .battle-side-head { padding: .3rem .36rem !important; }
            #battleView .battle-side-head h3 { font-size: .72rem !important; }
            #battleView .battle-side.hero .battle-portrait-icon img { transform: scale(.86) !important; }
            #battleView .battle-side.enemy .battle-portrait-icon img { transform: scale(.92) !important; }
          }
          EOF
          rm .github/workflows/oneoff-arena-layout-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 2026/modern-battle.css .github/workflows/oneoff-arena-layout-fix.yml
          git commit -m "fix: integrate fighters cleanly into arena"
          git push origin HEAD:tk2-2026
